<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Penampil Bidang Tanah BHUMI</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <style>
    :root {
      --milik: #1a9850; --lain: #e6a010; --unknown: #9e9e9e;
      --bg: #0f1720; --panel: #ffffff; --ink: #1b1b1b;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font: 14px/1.45 system-ui, -apple-system, sans-serif; }
    #map { position: absolute; inset: 0; background: #dfe7ee; }

    .card {
      position: absolute; z-index: 1000; background: var(--panel); color: var(--ink);
      border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.25); padding: 14px 16px;
    }
    #controls { top: 14px; left: 14px; width: 280px; }
    #controls h1 { font-size: 15px; margin: 0 0 2px; display: flex; align-items: center; gap: 8px; }
    #controls p.sub { margin: 0 0 12px; color: #667; font-size: 12px; }

    #drop {
      border: 2px dashed #b9c6d2; border-radius: 12px; padding: 18px 12px; text-align: center;
      color: #567; cursor: pointer; transition: .15s; font-size: 13px;
    }
    #drop.drag { border-color: var(--milik); background: #eaf7ee; color: var(--milik); }
    #drop b { color: #0a7d3c; }
    input[type=file] { display: none; }

    #stats { margin-top: 12px; display: none; }
    .row { display: flex; gap: 8px; }
    .stat { flex: 1; text-align: center; border-radius: 10px; padding: 8px 4px; }
    .stat .n { font: 800 20px system-ui; line-height: 1; }
    .stat .l { font-size: 10px; color: #556; margin-top: 2px; }
    .s-milik { background: rgba(26,152,80,.12); } .s-milik .n { color: var(--milik); }
    .s-lain  { background: rgba(230,160,16,.12); } .s-lain .n { color: var(--lain); }
    .s-unk   { background: rgba(158,158,158,.16); } .s-unk .n { color: #6b6b6b; }
    #total { font: 800 30px system-ui; margin-top: 10px; }
    #total small { font: 500 12px system-ui; color: #667; }

    #legend { bottom: 14px; left: 14px; padding: 10px 14px; font-size: 12px; }
    #legend .lg { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
    #legend .sw { width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgba(0,0,0,.2); }

    .leaflet-popup-content { font: 13px/1.5 system-ui; }
    .pk { color: #778; } .pv { font-weight: 600; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; color: #fff; font-size: 11px; font-weight: 700; }
    /* Permanent NIB labels above each point marker */
    .nib-label { background: rgba(255,255,255,.9); border: 1px solid rgba(0,0,0,.15); border-radius: 6px;
      padding: 1px 5px; font: 700 10px system-ui; color: #333; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
    .nib-label::before { display: none; }
    #map.hide-labels .nib-label { display: none; }
    #labeltoggle { margin-top: 10px; display: flex; align-items: center; gap: 6px; font-size: 12px; color: #556; cursor: pointer; }
  </style>
</head>
<body>
  <div id="map"></div>

  <div id="controls" class="card">
    <h1>🗺️ Bidang Tanah BHUMI</h1>
    <p class="sub">Buka file <code>.geojson</code> hasil rekaman untuk melihat petanya.</p>
    <label id="drop" for="file">
      <b>Klik untuk pilih file</b> atau seret <code>bhumi-bidang.geojson</code> ke sini
    </label>
    <input id="file" type="file" accept=".geojson,.json,application/geo+json,application/json" />

    <div id="stats">
      <div id="total">0 <small>bidang</small></div>
      <div class="row" style="margin-top:8px">
        <div class="stat s-milik"><div class="n" id="n-milik">0</div><div class="l">Hak Milik</div></div>
        <div class="stat s-lain"><div class="n" id="n-lain">0</div><div class="l">Hak lain</div></div>
        <div class="stat s-unk"><div class="n" id="n-unk">0</div><div class="l">? / kosong</div></div>
      </div>
      <label id="labeltoggle"><input type="checkbox" id="showlabels" checked /> Tampilkan label NIB di penanda</label>
    </div>
  </div>

  <div id="legend" class="card">
    <div class="lg"><span class="sw" style="background:var(--milik)"></span> Hak Milik</div>
    <div class="lg"><span class="sw" style="background:var(--lain)"></span> Hak lain (HGB/HGU/Pakai/dll)</div>
    <div class="lg"><span class="sw" style="background:var(--unknown)"></span> Tidak diketahui / kosong</div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    var map = L.map('map', { zoomControl: true }).setView([-2.5, 118], 5); // central Indonesia
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    var layer = null;
    var COLORS = { 'Hak Milik': '#1a9850', 'Hak lain': '#e6a010', 'Tidak diketahui': '#9e9e9e' };

    function colorOf(p) {
      if (p && p.warna) return p.warna;
      if (p && p.is_hak_milik) return COLORS['Hak Milik'];
      if (p && p.kategori && COLORS[p.kategori]) return COLORS[p.kategori];
      return COLORS['Tidak diketahui'];
    }
    function kategoriOf(p) {
      if (p && p.kategori) return p.kategori;
      if (p && p.is_hak_milik) return 'Hak Milik';
      return 'Tidak diketahui';
    }

    function esc(s) { return String(s == null ? '' : s).replace(/[&<>]/g, function (c) { return ({ '&':'&amp;','<':'&lt;','>':'&gt;' })[c]; }); }

    function popupHtml(p) {
      p = p || {};
      var color = colorOf(p);
      var rows = [
        ['Tipe Hak', p.tipe_hak], ['NIB', p.nib], ['Penggunaan', p.penggunaan],
        ['Luas', p.luas], ['Pencarian', p.search_term], ['Sumber', p.source]
      ];
      var html = '<div><span class="badge" style="background:' + color + '">' + esc(kategoriOf(p)) + '</span></div>';
      html += '<table style="margin-top:6px;border-collapse:collapse">';
      rows.forEach(function (r) {
        if (r[1] == null || r[1] === '') return;
        html += '<tr><td class="pk" style="padding:1px 8px 1px 0">' + r[0] + '</td><td class="pv">' + esc(r[1]) + '</td></tr>';
      });
      html += '</table>';
      return html;
    }

    function render(geojson) {
      if (layer) { map.removeLayer(layer); layer = null; }
      var c = { total: 0, milik: 0, lain: 0, unk: 0 };

      layer = L.geoJSON(geojson, {
        style: function (f) {
          var col = colorOf(f.properties);
          return { color: col, weight: 2, fillColor: col, fillOpacity: 0.35 };
        },
        pointToLayer: function (f, latlng) {
          return L.circleMarker(latlng, { radius: 7, color: colorOf(f.properties), fillColor: colorOf(f.properties), fillOpacity: 0.8, weight: 2 });
        },
        onEachFeature: function (f, lyr) {
          var p = f.properties || {};
          lyr.bindPopup(popupHtml(p));
          // Permanent NIB labels make previously marked parcels visible.
          if (p.nib && f.geometry && f.geometry.type === 'Point') {
            lyr.bindTooltip(String(p.nib), { permanent: true, direction: 'top', className: 'nib-label', offset: [0, -8] });
          }
          c.total++;
          var k = kategoriOf(p);
          if (k === 'Hak Milik') c.milik++; else if (k === 'Hak lain') c.lain++; else c.unk++;
        }
      }).addTo(map);

      document.getElementById('stats').style.display = 'block';
      document.getElementById('total').innerHTML = c.total + ' <small>bidang</small>';
      document.getElementById('n-milik').textContent = c.milik;
      document.getElementById('n-lain').textContent = c.lain;
      document.getElementById('n-unk').textContent = c.unk;

      try {
        var b = layer.getBounds();
        if (b.isValid()) map.fitBounds(b, { padding: [60, 60], maxZoom: 18 });
        else alert('File terbaca, tapi tidak ada geometri untuk dipetakan (mungkin data hanya dari panel tanpa koordinat). Cek CSV untuk atributnya.');
      } catch (e) {}
    }

    function loadFile(file) {
      if (!file) return;
      var fr = new FileReader();
      fr.onload = function () {
        try { render(JSON.parse(fr.result)); }
        catch (e) { alert('File bukan GeoJSON yang valid: ' + e.message); }
      };
      fr.readAsText(file);
    }

    var fileInput = document.getElementById('file');
    var drop = document.getElementById('drop');
    var showLabels = document.getElementById('showlabels');
    showLabels.addEventListener('change', function () {
      document.getElementById('map').classList.toggle('hide-labels', !showLabels.checked);
    });
    fileInput.addEventListener('change', function () { loadFile(fileInput.files[0]); });
    ['dragenter', 'dragover'].forEach(function (ev) {
      drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('drag'); });
      document.body.addEventListener(ev, function (e) { e.preventDefault(); });
    });
    ['dragleave', 'drop'].forEach(function (ev) {
      drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('drag'); });
    });
    drop.addEventListener('drop', function (e) {
      e.preventDefault();
      if (e.dataTransfer.files && e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
    });
    document.body.addEventListener('drop', function (e) {
      e.preventDefault();
      if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
    });
  </script>
</body>
</html>
